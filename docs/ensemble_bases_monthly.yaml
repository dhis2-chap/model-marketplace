# Configured models for the admin-1 monthly climate-health datasets used in the
# ensemble analysis (Laos: 18 locations, Vietnam: 63 locations, Thailand).
#
# Dataset shape these configurations are sized for:
#   - monthly periods, 1998-01..2010-12 (156 periods per location, 13 full seasons)
#   - columns: disease_cases (target, ~2-8% missing), population, rainfall,
#     mean_temperature, mean_relative_humidity
#   - forecast horizon 3 (--backtest-params.n-periods 3); auto_regressive_monthly_v2
#     declares max_prediction_length: 3, so the horizon cannot be raised without
#     dropping that model.
#
# Versions for ewars_template, chap_pymc and auto_regressive_monthly_v2 are pinned to
# the same commits default.yaml already seeds, so this file only adds configurations
# and does not move those templates to another version.
#
# Every block under `configurations:` is also a valid standalone
# --model-configuration-yaml file for `chap eval` and `chap evaluate-ensemble`:
# copy the two inner keys (user_option_values, additional_continuous_covariates)
# into their own file.
#
# Note on n_samples: CHAP scores CRPS with the biased 1/n^2 order-statistic
# estimator, so forecasts represented by few samples are penalised. Where drawing
# samples is cheap these configurations ask for 500 so that base models and the
# ensemble are compared on a comparable sample budget.

- url: https://github.com/chap-models/mstl_arima
  versions:
    v1: "@6cdec6fc7c512d5795ff888383762c39c903d55d"
  configurations:
    # Self-forecasts seasonality and takes no covariates
    # (allow_free_additional_continuous_covariates is false), which makes it the
    # information-diverse member of an ensemble that otherwise shares climate inputs.
    monthly:
      user_option_values:
        season_length_monthly: 12
        log_transform: true
        n_samples: 500
        arima_stepwise: true
        arima_approximation: false
        random_seed: 42
    # Same model with the faster AutoARIMA search, for wide backtest sweeps
    # (n_splits 12 across three countries). Approximation drops MA terms and is
    # less calibrated, so do not report CRPS from this config against `monthly`.
    monthly_fast:
      user_option_values:
        season_length_monthly: 12
        log_transform: true
        n_samples: 200
        arima_stepwise: true
        arima_approximation: true
        random_seed: 42

- url: https://github.com/knutdrand/mstl_multistep_model
  versions:
    v1: "@c8174835a909107bd2f4a0069f4d743ea50b64a8"
  configurations:
    # Climate-driven variant. Covariate lags 1-3 are all observed within a 3-period
    # horizon, so no covariate has to be imputed at predict time.
    monthly_climate:
      user_option_values:
        target_variable: disease_cases
        treat_missing_as_zero: false   # gaps in disease_cases are missing reports, not zeros
        season_length_monthly: 12
        feature_min_lag: 1
        feature_max_lag: 3
        rf_target_lags: 3
        use_location_dummies: true     # 18 (Laos) / 63 (Vietnam) series pooled in one forest
        arima_order: [0, 1, 2]
        arima_level: 68
        residual_variance: tree
        residual_variance_scale: 0.5
        n_samples: 500
        random_seed: 42
      additional_continuous_covariates:
        - rainfall
        - mean_temperature
        - mean_relative_humidity
    # Covariate-free variant: MSTL + ARIMA with a RandomForest correction on lagged
    # self-history only. Deliberately a weaker, differently-informed base model.
    # IRS options are left unset - these datasets carry no spraying columns.
    monthly_selfhistory:
      user_option_values:
        target_variable: disease_cases
        treat_missing_as_zero: false
        season_length_monthly: 12
        rf_target_lags: 6
        use_location_dummies: true
        arima_order: [0, 1, 2]
        residual_variance: tree
        residual_variance_scale: 0.5
        n_samples: 500
        random_seed: 42

- url: https://github.com/dhis2-chap/ewars_template
  versions:
    v6: "@cdd06ed61ee0f6eccab1fc9b9d74eb52cb122539"
  configurations:
    # n_lags is positional: one entry per additional_continuous_covariates entry,
    # in the same order. population is a required covariate and is supplied
    # automatically, so it is not repeated here.
    monthly_climate:
      user_option_values:
        n_lags: [3, 3]
        precision: 1
        region_seasonal: false
      additional_continuous_covariates:
        - rainfall
        - mean_temperature
    # Region-specific seasonal effects. 13 complete seasons per location is enough
    # to identify these on both the 18-location and 63-location datasets, at the
    # cost of a noticeably slower INLA fit.
    monthly_region_seasonal:
      user_option_values:
        n_lags: [3, 3]
        precision: 1
        region_seasonal: true
      additional_continuous_covariates:
        - rainfall
        - mean_temperature

- url: https://github.com/dhis2-chap/chap_pymc
  versions:
    uv: "@cce2e8c7e73980b3c8b63884802f8342e584eb9f"
  configurations:
    # Reference HMC fit. mean_temperature is required and supplied automatically.
    # skip_bottom_n_seasons drops the two weakest seasons of the 13 available; the
    # model card warns about very high upper quantiles when predicting across a
    # season boundary, and this is the shipped mitigation.
    monthly_hmc:
      user_option_values:
        method: hmc
        draws: 500
        tune: 500
        chains: 4
        target_accept: 0.95
        n_harmonics: 3
        lag: 3
        use_prev_year: true
        do_ar_effect: false
        prior_strength: 1.0
        skip_bottom_n_seasons: 2
        random_seed: 42
      additional_continuous_covariates:
        - rainfall
    # Variational fit for backtest sweeps, where a 4-chain HMC run per split per
    # country is the dominant cost. Cheaper, and less reliable in the tails.
    monthly_advi:
      user_option_values:
        method: advi
        n_iterations: 200000
        n_samples: 500
        n_harmonics: 3
        lag: 3
        use_prev_year: true
        skip_bottom_n_seasons: 2
        random_seed: 42
      additional_continuous_covariates:
        - rainfall

# The MLproject name is "auto_regressive_monthly", so an explicit name is needed to
# keep this template separate from the v1 model, exactly as in default.yaml.
- url: https://github.com/chap-models/auto_regressive_monthly_v2
  name: auto_regressive_monthly_v2
  versions:
    stable: "@d4d6b78212c7079b3d151bb8aba7e042c2393953"
  configurations:
    # prediction_length must equal --backtest-params.n-periods. rainfall,
    # mean_temperature and population are required and supplied automatically.
    monthly_h3:
      user_option_values:
        prediction_length: 3
        context_length: 36          # 3 seasons of context; 156 periods leaves ample training data
        n_iter: 400
        n_ensemble: 5
        learning_rate: 0.001
        cell: gru
        rnn_features: 16
        head_features: 24
        rnn_layers: 1
        recursive_decode: false
        dropout_rate: 0.2
      additional_continuous_covariates:
        - mean_relative_humidity
    # Lighter fit for wide sweeps: shorter context and fewer ensemble members.
    monthly_h3_light:
      user_option_values:
        prediction_length: 3
        context_length: 24
        n_iter: 300
        n_ensemble: 3
        learning_rate: 0.001
        cell: gru
        dropout_rate: 0.2
      additional_continuous_covariates:
        - mean_relative_humidity
