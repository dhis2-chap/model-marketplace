schema_version: 1

id: mstl_arima
display_name: MSTL + AutoARIMA
maturity: experimental

summary: >-
  Seasonal-trend decomposition (MSTL) with an AutoARIMA forecaster.
  Self-forecasts seasonality and takes no covariates, which makes it the
  information-diverse member of an ensemble that otherwise shares climate
  inputs.

source:
  repository: https://github.com/chap-models/mstl_arima

# GitHub handles responsible for this listing — backfilled from the source
# repository's contributors; corrections welcome by PR.
maintainers:
  - knutdrand

compatibility:
  period_types: [monthly]

covariates:
  required: []
  # allow_free_additional_continuous_covariates is false: the model takes no
  # additional covariates.
  additional_continuous: []

channels:
  stable: v1
  latest: v1

versions:
  - version: v1
    commit: 6cdec6fc7c512d5795ff888383762c39c903d55d
    status: verified
    # Verified by the merge gate. This pin was part of the seed import, which
    # predates recorded approvals; pins added by PR list their three approvers.
    verified_by: []
    changelog: null

# Verified configurations. Each block is a valid standalone
# --model-configuration-yaml file for `chap eval` and
# `chap evaluate-ensemble`.
#
# Note on n_samples: CHAP scores CRPS with the biased 1/n^2 order-statistic
# estimator, so forecasts represented by few samples are penalised. Where
# drawing samples is cheap these configurations ask for 500 so that base
# models and ensembles are compared on a comparable sample budget.
configurations:
  monthly:
    description: >-
      Reference configuration with the exact (non-approximated) AutoARIMA
      search.
    user_option_values:
      season_length_monthly: 12
      log_transform: true
      n_samples: 500
      arima_stepwise: true
      arima_approximation: false
      random_seed: 42
  monthly_fast:
    description: >-
      Same model with the faster AutoARIMA search, for wide backtest sweeps.
      Approximation drops MA terms and is less calibrated, so do not report
      CRPS from this configuration against `monthly`.
    user_option_values:
      season_length_monthly: 12
      log_transform: true
      n_samples: 200
      arima_stepwise: true
      arima_approximation: true
      random_seed: 42
