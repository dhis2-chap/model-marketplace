  - version: v0.1.1
    commit: 4e594f9f8dad3b509ab9f86926bddbd21da2b0d6
    status: deprecated
    verified_by: []
    changelog: >-
      Installs simple_multistep_model from its git repository.
  - version: v0.1.0
    commit: 46d7000c7aaeaaf46fc763b9a3337f78cf38bc77
