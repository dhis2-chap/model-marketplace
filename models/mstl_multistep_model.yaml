schema_version: 1

id: mstl_multistep_model
display_name: MSTL Multistep
maturity: experimental

summary: >-
  MSTL + ARIMA with a RandomForest correction. Runs either climate-driven
  (lagged climate covariates) or on lagged self-history only, which makes it
  useful both as a covariate model and as a deliberately weaker,
  differently-informed ensemble member.

source:
  repository: https://github.com/knutdrand/mstl_multistep_model

maintainers: []   # TODO: list GitHub handles of the responsible maintainers

compatibility:
  period_types: [monthly]

covariates:
  required: []
  additional_continuous:
    - rainfall
    - mean_temperature
    - mean_relative_humidity

channels:
  stable: v1
  latest: v1

versions:
  - version: v1
    commit: c8174835a909107bd2f4a0069f4d743ea50b64a8
    status: verified
    verified_by: []   # TODO: the three approving maintainers
    changelog: null

# Verified configurations. Each block is a valid standalone
# --model-configuration-yaml file for `chap eval` and
# `chap evaluate-ensemble`.
configurations:
  monthly_climate:
    description: >-
      Climate-driven variant. Covariate lags 1-3 are all observed within a
      3-period horizon, so no covariate has to be imputed at predict time.
      treat_missing_as_zero is false because gaps in disease_cases are
      missing reports, not zeros. use_location_dummies pools all locations
      in one forest (e.g. the 18-location and 63-location ensemble
      datasets).
    user_option_values:
      target_variable: disease_cases
      treat_missing_as_zero: false
      season_length_monthly: 12
      feature_min_lag: 1
      feature_max_lag: 3
      rf_target_lags: 3
      use_location_dummies: true
      arima_order: [0, 1, 2]
      arima_level: 68
      residual_variance: tree
      residual_variance_scale: 0.5
      n_samples: 500
      random_seed: 42
    additional_continuous_covariates:
      - rainfall
      - mean_temperature
      - mean_relative_humidity
  monthly_selfhistory:
    description: >-
      Covariate-free variant: MSTL + ARIMA with a RandomForest correction on
      lagged self-history only. Deliberately a weaker, differently-informed
      base model. IRS options are left unset — set them only on datasets
      that carry spraying columns.
    user_option_values:
      target_variable: disease_cases
      treat_missing_as_zero: false
      season_length_monthly: 12
      rf_target_lags: 6
      use_location_dummies: true
      arima_order: [0, 1, 2]
      residual_variance: tree
      residual_variance_scale: 0.5
      n_samples: 500
      random_seed: 42
