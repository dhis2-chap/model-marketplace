schema_version: 1

id: mstl_multistep_model
display_name: MSTL Multistep
maturity: experimental

summary: >-
  MSTL + ARIMA with a RandomForest correction. Runs either climate-driven
  (lagged climate covariates) or on lagged self-history only, which makes it
  useful both as a covariate model and as a deliberately weaker,
  differently-informed ensemble member.

source:
  repository: https://github.com/knutdrand/mstl_multistep_model
  # The MLproject declares uv_env (pyproject.toml): chapkit runs it via
  # `chapkit mlproject run` inside a uv-activated shell or the
  # ghcr.io/dhis2-chap/chapkit-py-cli image.

# GitHub handles responsible for this listing — backfilled from the source
# repository's contributors; corrections welcome by PR.
maintainers:
  - knutdrand

compatibility:
  period_types: [monthly]

covariates:
  required: []
  additional_continuous:
    - rainfall
    - mean_temperature
    - mean_relative_humidity

channels:
  stable: v1
  latest: v1

versions:
  - version: v1
    commit: c8174835a909107bd2f4a0069f4d743ea50b64a8
    status: verified
    # Verified by the merge gate. This pin was part of the seed import, which
    # predates recorded approvals; pins added by PR list their three approvers.
    verified_by: []
    changelog: >-
      The model_config wrapper ignores unknown keys, so configuration files
